<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -110 540 806" width="540" height="806"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#555"/></marker></defs><rect x="-40" y="-110" width="100%" height="100%" fill="#fff"/><text x="0" y="-46" font-size="24" fill="#1e1e1e" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">Task manager: stages</text><rect x="0" y="0" width="460" height="76" rx="12" fill="#f1f0ec" stroke="#1e1e1e" stroke-width="1.5"/><text x="20" y="32" font-size="18" fill="#1e1e1e" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">1 · Input</text><text x="20" y="58" font-size="14" fill="#3b3b3b" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">One sentence from the user</text><rect x="0" y="116" width="460" height="76" rx="12" fill="#ece9f8" stroke="#1e1e1e" stroke-width="1.5"/><text x="20" y="148" font-size="18" fill="#1e1e1e" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">2 · Intent</text><text x="20" y="174" font-size="14" fill="#3b3b3b" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">What does the user want: create, update, delete?</text><rect x="0" y="232" width="460" height="76" rx="12" fill="#d9e8fb" stroke="#1e1e1e" stroke-width="1.5"/><text x="20" y="264" font-size="18" fill="#1e1e1e" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">3 · Identify task</text><text x="20" y="290" font-size="14" fill="#3b3b3b" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">Which existing task is meant (update and delete only)</text><rect x="0" y="348" width="460" height="76" rx="12" fill="#d6f0e0" stroke="#1e1e1e" stroke-width="1.5"/><text x="20" y="380" font-size="18" fill="#1e1e1e" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">4 · Agent</text><text x="20" y="406" font-size="14" fill="#3b3b3b" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">Calls the create, update or delete tool</text><rect x="0" y="464" width="460" height="76" rx="12" fill="#fbe0d6" stroke="#1e1e1e" stroke-width="1.5"/><text x="20" y="496" font-size="18" fill="#1e1e1e" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">5 · Labels</text><text x="20" y="522" font-size="14" fill="#3b3b3b" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">Pulls out a summary, time, date and location</text><rect x="0" y="580" width="460" height="76" rx="12" fill="#fff3c4" stroke="#1e1e1e" stroke-width="1.5"/><text x="20" y="612" font-size="18" fill="#1e1e1e" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">6 · Save and reply</text><text x="20" y="638" font-size="14" fill="#3b3b3b" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">Stores it in SQLite and shows the reply and cost</text><polyline points="230,76 230,116" fill="none" stroke="#1e1e1e" stroke-width="1.5" marker-end="url(#a)"/><polyline points="230,192 230,232" fill="none" stroke="#1e1e1e" stroke-width="1.5" marker-end="url(#a)"/><polyline points="230,308 230,348" fill="none" stroke="#1e1e1e" stroke-width="1.5" marker-end="url(#a)"/><polyline points="230,424 230,464" fill="none" stroke="#1e1e1e" stroke-width="1.5" marker-end="url(#a)"/><polyline points="230,540 230,580" fill="none" stroke="#1e1e1e" stroke-width="1.5" marker-end="url(#a)"/></svg>