<svg xmlns="http://www.w3.org/2000/svg" viewBox="-80 -158 1230 1652.5" width="1230" height="1652.5"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#555"/></marker></defs><rect x="-80" y="-158" width="100%" height="100%" fill="#fff"/><rect x="296" y="132.75" width="814" height="1008.25" rx="12" fill="transparent" stroke="#7b61c9" stroke-width="1.5" stroke-dasharray="6 4"/><text x="300" y="-92" font-size="26" fill="#1e1e1e" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">Task manager: what happens to one sentence</text><text x="300" y="-67" font-size="13" fill="#555555" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">Every box is one step. Each model step returns JSON that is validated before the next step uses it.</text><text x="300" y="-50.75" font-size="13" fill="#555555" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">Dashed outline: everything inside is one Langfuse trace (span task-action) and one cost total in Logs.</text><rect x="320" y="0" width="520" height="110.75" rx="12" fill="#f1f0ec" stroke="#1e1e1e" stroke-width="1.5"/><text x="336" y="34" font-size="18" fill="#1e1e1e" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">1 · Input box (React page)</text><text x="336" y="59" font-size="13" fill="#3b3b3b" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">Goal: take one sentence and send it with the user's time zone.</text><text x="336" y="75.25" font-size="13" fill="#3b3b3b" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">Sends: POST /api/act { input, timeZone }  (max 500 characters)</text><text x="336" y="91.5" font-size="13" fill="#3b3b3b" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">Server runs one action at a time so the task list cannot change mid-run.</text><rect x="320" y="168.75" width="520" height="159.5" rx="12" fill="#ece9f8" stroke="#1e1e1e" stroke-width="1.5"/><text x="336" y="202.75" font-size="18" fill="#1e1e1e" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">2 · Intent   (gpt-5-nano)</text><text x="336" y="227.75" font-size="13" fill="#3b3b3b" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">Goal: decide what the user wants before anything changes.</text><text x="336" y="244" font-size="13" fill="#3b3b3b" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">Sees only the request, not the task list.</text><text x="336" y="260.25" font-size="13" fill="#3b3b3b" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">Returns: { intents[], summary, message }</text><text x="336" y="276.5" font-size="13" fill="#3b3b3b" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">intents: create, update, delete, unclear, unsupported</text><text x="336" y="292.75" font-size="13" fill="#3b3b3b" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">Checks: zod; one retry that lists the valid intents;</text><text x="336" y="309" font-size="13" fill="#3b3b3b" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">a second failure becomes 'unclear' (ask to rephrase).</text><rect x="320" y="386.25" width="520" height="159.5" rx="12" fill="#d9e8fb" stroke="#1e1e1e" stroke-width="1.5"/><text x="336" y="420.25" font-size="18" fill="#1e1e1e" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">3 · Identify task   (gpt-5-nano, update / delete only)</text><text x="336" y="445.25" font-size="13" fill="#3b3b3b" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">Goal: find which existing task the user means.</text><text x="336" y="461.5" font-size="13" fill="#3b3b3b" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">Reads an index, one line per task: id | summary | labels</text><text x="336" y="477.75" font-size="13" fill="#3b3b3b" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">   e.g.  TSK-002 | Call Sara | time 17:00</text><text x="336" y="494" font-size="13" fill="#3b3b3b" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">Returns: { task_ids[], question }</text><text x="336" y="510.25" font-size="13" fill="#3b3b3b" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">Checks: every id must exist (unknown id is rejected and retried).</text><text x="336" y="526.5" font-size="13" fill="#3b3b3b" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">A typed TSK id skips the model.</text><rect x="320" y="603.75" width="520" height="143.25" rx="12" fill="#d6f0e0" stroke="#1e1e1e" stroke-width="1.5"/><text x="336" y="637.75" font-size="18" fill="#1e1e1e" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">4 · Agent   (gpt-5-mini)</text><text x="336" y="662.75" font-size="13" fill="#3b3b3b" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">Goal: carry out the request by calling tools.</text><text x="336" y="679" font-size="13" fill="#3b3b3b" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">Gets: intent, the full text of the identified tasks, and only the</text><text x="336" y="695.25" font-size="13" fill="#3b3b3b" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">tools the intent allows: create_task, update_task, delete_task.</text><text x="336" y="711.5" font-size="13" fill="#3b3b3b" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">Update writes the complete new description.</text><text x="336" y="727.75" font-size="13" fill="#3b3b3b" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">Ends with: { status: done | needs_clarification | unsupported, reply }</text><rect x="320" y="805" width="520" height="110.75" rx="12" fill="#fff3c4" stroke="#1e1e1e" stroke-width="1.5"/><text x="336" y="839" font-size="18" fill="#1e1e1e" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">5 · Run the tool   (plain code)</text><text x="336" y="864" font-size="13" fill="#3b3b3b" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">Goal: execute the call; errors go back to the agent as text.</text><text x="336" y="880.25" font-size="13" fill="#3b3b3b" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">Guards: update and delete only touch the identified ids;</text><text x="336" y="896.5" font-size="13" fill="#3b3b3b" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">delete by description must match exactly one task.</text><rect x="320" y="973.75" width="520" height="143.25" rx="12" fill="#fbe0d6" stroke="#1e1e1e" stroke-width="1.5"/><text x="336" y="1007.75" font-size="18" fill="#1e1e1e" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">6 · Extract labels   (gpt-5-nano, create / update)</text><text x="336" y="1032.75" font-size="13" fill="#3b3b3b" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">Goal: pull a short summary and the time, date and location from the text.</text><text x="336" y="1049" font-size="13" fill="#3b3b3b" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">Returns: { summary, time HH:MM, date YYYY-MM-DD, location,</text><text x="336" y="1065.25" font-size="13" fill="#3b3b3b" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">           missing_labels }   (not found = null, and listed as missing)</text><text x="336" y="1081.5" font-size="13" fill="#3b3b3b" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">Checks: real calendar date, missing_labels = exactly the nulls;</text><text x="336" y="1097.75" font-size="13" fill="#3b3b3b" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">one retry with the errors, else all labels missing. Delete skips this.</text><rect x="320" y="1175" width="520" height="110.75" rx="12" fill="#fff3c4" stroke="#1e1e1e" stroke-width="1.5"/><text x="336" y="1209" font-size="18" fill="#1e1e1e" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">7 · Save   (SQLite, data/tasks.db)</text><text x="336" y="1234" font-size="13" fill="#3b3b3b" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">tasks: description, summary, missing_labels, timestamps</text><text x="336" y="1250.25" font-size="13" fill="#3b3b3b" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">task_labels: the time / date / location that were found</text><text x="336" y="1266.5" font-size="13" fill="#3b3b3b" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">actions: input, intent, changes with labels, every model call, cost, trace id</text><rect x="320" y="1343.75" width="520" height="110.75" rx="12" fill="#f1f0ec" stroke="#1e1e1e" stroke-width="1.5"/><text x="336" y="1377.75" font-size="18" fill="#1e1e1e" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">8 · Reply to the page</text><text x="336" y="1402.75" font-size="13" fill="#3b3b3b" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">Show the reply and refresh the task list (last modified first).</text><text x="336" y="1419" font-size="13" fill="#3b3b3b" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">Logs button: cost of this action, end to end, per model call.</text><text x="336" y="1435.25" font-size="13" fill="#3b3b3b" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">Task modal > History: each action with its intent and labels.</text><rect x="-40" y="168.75" width="250" height="127" rx="12" fill="#fde2e2" stroke="#c25b5b" stroke-width="1.5"/><text x="-24" y="202.75" font-size="18" fill="#1e1e1e" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">Stop: answer here</text><text x="-24" y="227.75" font-size="13" fill="#3b3b3b" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">unclear or unsupported:</text><text x="-24" y="244" font-size="13" fill="#3b3b3b" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">the intent step's own message</text><text x="-24" y="260.25" font-size="13" fill="#3b3b3b" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">is the reply. No agent call,</text><text x="-24" y="276.5" font-size="13" fill="#3b3b3b" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">nothing changes.</text><rect x="-40" y="386.25" width="250" height="110.75" rx="12" fill="#fde2e2" stroke="#c25b5b" stroke-width="1.5"/><text x="-24" y="420.25" font-size="18" fill="#1e1e1e" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">Stop: ask the user</text><text x="-24" y="445.25" font-size="13" fill="#3b3b3b" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">No task fits, or several do:</text><text x="-24" y="461.5" font-size="13" fill="#3b3b3b" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">reply asks 'which one?'.</text><text x="-24" y="477.75" font-size="13" fill="#3b3b3b" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">Nothing changes.</text><text x="720" y="152.75" font-size="12" fill="#7b61c9" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">one Langfuse trace</text><polyline points="580,110.75 580,168.75" fill="none" stroke="#1e1e1e" stroke-width="1.5" marker-end="url(#a)"/><polyline points="580,328.25 580,386.25" fill="none" stroke="#1e1e1e" stroke-width="1.5" marker-end="url(#a)"/><text x="590" y="350.25" font-size="12" fill="#555555" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">update / delete</text><polyline points="580,545.75 580,603.75" fill="none" stroke="#1e1e1e" stroke-width="1.5" marker-end="url(#a)"/><text x="590" y="567.75" font-size="12" fill="#555555" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">task ids found</text><polyline points="580,747 580,805" fill="none" stroke="#1e1e1e" stroke-width="1.5" marker-end="url(#a)"/><text x="590" y="769" font-size="12" fill="#555555" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">tool call</text><polyline points="580,915.75 580,973.75" fill="none" stroke="#1e1e1e" stroke-width="1.5" marker-end="url(#a)"/><text x="590" y="937.75" font-size="12" fill="#555555" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">create / update</text><polyline points="580,1117 580,1175" fill="none" stroke="#1e1e1e" stroke-width="1.5" marker-end="url(#a)"/><polyline points="580,1285.75 580,1343.75" fill="none" stroke="#1e1e1e" stroke-width="1.5" marker-end="url(#a)"/><polyline points="320,248.5 210,232.25" fill="none" stroke="#c25b5b" stroke-width="1.5" marker-end="url(#a)"/><text x="222" y="224.5" font-size="12" fill="#c25b5b" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">unclear /</text><text x="222" y="239.5" font-size="12" fill="#c25b5b" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">unsupported</text><polyline points="320,466 210,441.625" fill="none" stroke="#c25b5b" stroke-width="1.5" marker-end="url(#a)"/><text x="222" y="442" font-size="12" fill="#c25b5b" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">none /</text><text x="222" y="457" font-size="12" fill="#c25b5b" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">several</text><polyline points="840,248.5 878,248.5 878,675.375 840,675.375" fill="none" stroke="#1e1e1e" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="6 4"/><text x="854" y="260.5" font-size="12" fill="#555555" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">create only:</text><text x="854" y="275.5" font-size="12" fill="#555555" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">skip identify</text><polyline points="840,860.375 926,860.375 926,675.375 840,675.375" fill="none" stroke="#1e1e1e" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="6 4"/><text x="896" y="838.375" font-size="12" fill="#555555" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">tool result back to the agent</text><text x="896" y="853.375" font-size="12" fill="#555555" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">(up to 5 rounds)</text><polyline points="320,860.375 280,860.375 280,1230.375 320,1230.375" fill="none" stroke="#1e1e1e" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="6 4"/><text x="256" y="892.375" font-size="12" fill="#555555" font-family="Helvetica, Arial, sans-serif" xml:space="preserve">delete</text></svg>