# Models the gateway offers. `model_name` is what callers ask for;
# `litellm_params.model` is the real provider and model behind it.
# Model names change over time: check each provider's docs and edit here.
model_list:
  - model_name: gpt-5-mini
    litellm_params:
      model: openai/gpt-5-mini
      api_key: os.environ/OPENAI_API_KEY

  - model_name: claude-haiku
    litellm_params:
      model: anthropic/claude-haiku-5-5
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-sonnet
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      api_key: os.environ/ANTHROPIC_API_KEY

# Callers must send this key, so the gateway is not open to anything on your network.
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
